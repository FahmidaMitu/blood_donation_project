{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="card-title text-center mb-4">Update Donor Profile</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100">Save Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
